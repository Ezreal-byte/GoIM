<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoIM · 局域网文件分享</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fb;--panel:#fff;--text:#172033;--muted:#525e72;--line:#d8deea;--accent:#1f55d7;--error:#b42328}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--panel:#192131;--text:#f0f4ff;--muted:#b2bfd5;--line:#39445b;--accent:#3867ec;--error:#ff9b9b}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
main{max-width:34rem;margin:clamp(1rem,10vh,6rem) auto;padding:1rem}article{padding:clamp(1.1rem,5vw,2.2rem);background:var(--panel);border:1px solid var(--line);border-radius:1rem}
.brand{font-weight:700}.brand span{display:inline-block;width:.65rem;height:.65rem;border-radius:50%;background:#1da763;margin-right:.55rem}
h1{font-size:1.55rem;line-height:1.3;margin:1.1rem 0 .5rem}p{margin:.55rem 0;color:var(--muted)}
.file{border:1px solid var(--line);border-radius:.65rem;padding:.85rem;margin:1rem 0;overflow-wrap:anywhere}.error{color:var(--error)}
label{display:block;margin-top:1rem;font-weight:600}input{margin:.35rem 0 1rem;width:100%;min-height:2.8rem;border:1px solid var(--line);border-radius:.5rem;background:var(--panel);padding:.55rem .7rem;color:var(--text);font:inherit}
.action{display:inline-block;width:100%;border:0;border-radius:.55rem;background:var(--accent);color:white;text-align:center;text-decoration:none;padding:.65rem 1rem;font:inherit;font-weight:650;cursor:pointer}
.action:focus-visible,input:focus-visible{outline:3px solid #759cff;outline-offset:2px}footer{margin-top:1rem;color:var(--muted);font-size:.83rem}
</style>
</head>
<body><main><article>
<div class="brand"><span></span>GoIM</div>
<h1>局域网文件分享</h1>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
{{if .Locked}}
<p>这个分享需要密码。请向发送方索取。</p>
<form method="post" action="{{.Path}}">
<label for="password">分享密码</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
<button class="action" type="submit">查看文件</button>
</form>
{{else if .Name}}
<div class="file"><strong>{{.Name}}</strong><p>{{.Size}}</p></div>
<a class="action" href="{{.Path}}/download">下载文件</a>
{{end}}
<footer>请与发送方连接同一局域网。发送方需保持 GoIM 运行。</footer>
</article></main></body>
</html>
