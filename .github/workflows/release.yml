name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        default: 0.2.1
        required: true
        type: string

permissions:
  contents: read
env:
  GOWORK: 'off'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-viva:
    name: Verify Viva fork main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check the pinned release dependency
        shell: bash
        run: |
          set -euo pipefail
          source=$(go list -m -f '{{with .Replace}}{{.Path}} {{.Version}}{{end}}' github.com/vivaui/viva)
          if [[ "$source" != 'github.com/Ezreal-byte/viva '* ]]; then
            echo '::error::The release must use a version pinned from the GoIM Viva fork.'
            exit 1
          fi
          version=${source#* }
          fork_main=$(git ls-remote --exit-code https://github.com/Ezreal-byte/viva.git refs/heads/main | cut -f1)
          if [[ ! "$version" =~ [0-9]{14}-[0-9a-f]{12}$ || "${version##*-}" != "${fork_main:0:12}" ]]; then
            echo "::error::Viva pin $version does not match fork main ($fork_main). Update go.mod and go.sum before tagging the release."
            exit 1
          fi
          echo "Viva fork main $fork_main verified against $version"
  verify-helper:
    name: Verify pinned remote desktop component
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Check the independently versioned helper pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/remote-helper.py verify-lock
          python3 scripts/remote-helper.py verify-release
  media:
    needs: verify-viva
    name: Media decoder ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: windows, arch: amd64}
          - {runner: ubuntu-24.04, os: windows, arch: arm64}
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: bash packaging/media/build.sh ${{ matrix.os }} ${{ matrix.arch }} media-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: decoder-${{ matrix.os }}-${{ matrix.arch }}
          path: media-bundle
          if-no-files-found: error
          retention-days: 3
  build:
    needs: [media, verify-helper]
    permissions:
      contents: read
      actions: read
    env:
      GOIM_MEDIA_BUNDLE: ${{ github.workspace }}/GoIM/.runtime/media-bundle
    name: ${{ matrix.os }}-${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, os: windows, arch: amd64, goarch: x64}
          - {runner: windows-11-arm, os: windows, arch: arm64, goarch: arm64}
          - {runner: ubuntu-24.04, os: linux, arch: amd64, goarch: x64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, goarch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64, goarch: x64}
          - {runner: macos-15, os: darwin, arch: arm64, goarch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: GoIM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: GoIM}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.goarch }}
          cache-dependency-path: GoIM/go.sum
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          if [[ "$RUNNER_ARCH" == X64 && -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          # Publish corresponding source for the libraries shipped offline.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          # Keep bundled binaries at repository versions whose exact source
          # archives are available for the corresponding-source artifact.
          sudo apt-get "${apt_options[@]}" upgrade -y
          sudo apt-get "${apt_options[@]}" install -y xclip libx11-6 libx11-xcb1 libxcb1 libxcb-shape0 libxkbcommon0 libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers fonts-noto-cjk xvfb xdotool libdigest-sha-perl build-essential meson ninja-build libgtk-3-dev gsettings-desktop-schemas gettext itstool curl xz-utils x11-utils dbus-x11 libpulse0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libxcb-randr0 libxcb-shm0 libxtst6 libxfixes3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: decoder-${{ matrix.os }}-${{ matrix.arch }}
          path: GoIM/.runtime/media-bundle
      - name: Fetch the pinned remote desktop helper
        env:
          GH_TOKEN: ${{ github.token }}
          HELPER_TARGET: ${{ matrix.os }}-${{ matrix.arch }}
        run: python scripts/remote-helper.py fetch --target "$HELPER_TARGET" --output .runtime/remote-helper
      - name: Verify remote desktop helper
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          name = 'goim-rd.exe' if os.name == 'nt' else 'goim-rd'
          helper = pathlib.Path('.runtime/remote-helper', name).resolve()
          helper.chmod(0o755)
          proc = subprocess.run([str(helper)], capture_output=True, timeout=15)
          assert proc.returncode == 1, (proc.returncode, proc.stderr)
          PY
      - name: Verify an authorized remote desktop session on X11
        if: runner.os == 'Linux'
        env:
          GOIM_TEST_REMOTE_DESKTOP_X11: '1'
          XDG_SESSION_TYPE: x11
          RUSTDESK_FORCED_DISPLAY_SERVER: x11
        run: |
          export GOIM_REMOTE_DESKTOP_HELPER="$PWD/.runtime/remote-helper/goim-rd"
          env -u WAYLAND_DISPLAY dbus-run-session -- xvfb-run -a -s '-screen 0 1280x720x24 -noreset' \
            go test ./internal/core -run '^TestRemoteDesktopNativeX11$' -v -count=1 -timeout=60s
      - name: Verify bundled video decoding
        run: |
          chmod +x .runtime/media-bundle/goim-media*
          go test ./internal/media -run '^TestBundledDecoder$' -count=1
      - name: Verify native architecture and dependencies
        run: |
          test "$(go env GOARCH)" = '${{ matrix.arch }}'
          go mod download
          test "$(go list -m -f '{{with .Replace}}{{.Path}}{{end}}' github.com/vivaui/viva)" = 'github.com/Ezreal-byte/viva'
          git diff --exit-code -- go.mod go.sum
      - name: Format, vet and full tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./... -count=1 -timeout=180s
      - name: Windows notification area regression
        if: runner.os == 'Windows'
        run: go test github.com/vivaui/viva/internal/platform/windows -run '^Test(NotificationIconCarriesABalloonWithoutShowingATrayEntry|TaskbarCreatedInvalidatesTheNotificationCarrier|NotificationModifyFailureRetriesAdd|NotificationCarrierRecoversAfterAModifyAndAddFailure|StatusHover.*)$' -count=1
      - name: macOS status item regression
        if: runner.os == 'macOS'
        run: go test github.com/vivaui/viva/internal/platform/darwin -run '^TestNativeStatusItemMenuDelegateAndSelection$' -count=1 -v
      - name: macOS application startup thread guard
        if: runner.os == 'macOS'
        run: go test github.com/vivaui/viva/app -run '^TestNativeStartupRejectsNonMainThread$' -count=1 -timeout=45s -v
      - name: Linux tray first frame and exposure regression
        if: runner.os == 'Linux'
        env:
          VIVA_TEST_NOTIFICATION_XVFB: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' go test github.com/vivaui/viva/internal/platform/linux -run '^Test(TrayWindowQueuedRedrawBeforeInput|TrayWindowRepaintsLaterExposure|TrayPanelUsesX11PixelsForScaledActivation|ExposureDoesNotPaintHiddenOrForeignWindow)$' -count=1 -timeout=45s -v
      - name: Core and background media race tests
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: go test -race ./internal/core ./internal/desktop ./internal/ipmsg ./internal/neiwangtong -count=1 -timeout=180s
      - name: Shared catalog ordering regression on macOS Intel
        if: matrix.os == 'darwin' && matrix.arch == 'amd64'
        run: go test ./internal/core -run 'TestCatalogRejectsOutOfOrderInitialSnapshot|TestUnsharingPreservesDownloadedMetadata' -count=20 -timeout=120s
      - name: Offscreen UI screenshots
        env:
          GOIM_QA_SCREENSHOTS: ${{ github.workspace }}/GoIM/artifacts/screenshots
          GOIM_CHAT_QA_SCREENSHOTS: ${{ github.workspace }}/GoIM/artifacts/screenshots/chat
          GOIM_CHAT_POLISH_QA: ${{ github.workspace }}/GoIM/artifacts/screenshots/chat
          GOIM_SNIP_SHOT_DIR: ${{ github.workspace }}/GoIM/artifacts/screenshots/snip
          GOIM_SHARE_LIST_QA: ${{ github.workspace }}/GoIM/artifacts/screenshots/shares
          GOIM_TRANSFER_QA: ${{ github.workspace }}/GoIM/artifacts/screenshots/transfers
        run: |
          go test -tags vivahead ./internal/desktop -run 'TestShellScreenshotQA|TestDesktopScaleMatrix|TestShellContextScreenshotQA|TestShareListDesignScreenshots|TestTransferDesignScreenshots|TestChatLayoutScreenshotQA|TestChatPolishQA|TestProfileAvatarEditorScreenshotQA|TestSettingsInterfaceFontScreenshotQA|TestDesktopFeatureRepairScreenshotQA|TestRelease013ScreenshotQA|TestVoiceCallScreenshotQA|TestFilePickerSupportScreenshotQA|TestRelease014ScreenshotQA' -count=1 -timeout=180s
          go test -tags vivahead ./cmd/goim-snip -run '^TestEditorScreenshots$' -count=1 -timeout=60s
      - name: Native content resize
        env:
          VIVA_NATIVE_WINDOW_SIZE_TEST: '1'
        run: |
          case '${{ matrix.os }}' in
            windows) go test github.com/vivaui/viva/app -run '^TestNativeProgrammaticWindowSize$' -count=1 -timeout=45s ;;
            linux) xvfb-run -a go test github.com/vivaui/viva/app -run '^TestNativeProgrammaticWindowSize$' -count=1 -timeout=45s ;;
            darwin) go test github.com/vivaui/viva/app -run '^TestWindowSetSize' -count=1 -timeout=45s ;;
          esac
      - name: Native global shortcut lifecycle
        env:
          VIVA_NATIVE_GLOBAL_SHORTCUT_TEST: '1'
        run: |
          case '${{ matrix.os }}' in
            windows) go test github.com/vivaui/viva/internal/platform/windows -run '^TestNative.*GlobalShortcut' -count=1 -timeout=30s -v ;;
            linux) xvfb-run -a go test github.com/vivaui/viva/internal/platform/linux -run '^TestNativeX11GlobalShortcut$' -count=1 -timeout=30s -v ;;
            darwin) go test github.com/vivaui/viva/internal/platform/darwin -run '^TestNativeCarbonGlobalShortcut$' -count=1 -timeout=30s -v ;;
          esac
      - name: Native Direct2D point ABI and rendering benchmark
        if: matrix.os == 'windows'
        run: |
          mkdir -p artifacts
          go test github.com/vivaui/viva/internal/platform/windows -run '^Test(DirectTextLayoutOriginByValue|HiddenNativeEditorDoesNotDrawColorEmoji)$' -count=1
          go test github.com/vivaui/viva/internal/platform/windows -run '^$' -bench '^BenchmarkRasterizeOnly$' -benchtime=100ms -benchmem -count=3 > artifacts/framework-render-benchmark.txt
      - name: Windows three-process smoke
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/smoke-headless.ps1
      - name: Windows NSIS compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($compiler) { return }

          $nsis = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'NSIS'
          if (!(Test-Path -LiteralPath (Join-Path $nsis 'makensis.exe'))) {
            # Download the portable archive directly to avoid the Chocolatey metadata service.
            $tools = Join-Path $env:RUNNER_TEMP 'goim-nsis'
            New-Item -ItemType Directory -Path $tools | Out-Null
            $package = Join-Path $tools 'nsis.portable.zip'
            Invoke-WebRequest -Uri 'https://packages.chocolatey.org/nsis.portable.3.13.0.nupkg' -OutFile $package -TimeoutSec 40 -MaximumRetryCount 3 -RetryIntervalSec 3
            Expand-Archive -LiteralPath $package -DestinationPath $tools
            $archive = Join-Path $tools 'tools/nsis-3.13.zip'
            $expected = 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
              throw 'The portable NSIS archive does not match the official checksum.'
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $tools
            $nsis = Join-Path $tools 'nsis-3.13'
          }

          & (Join-Path $nsis 'makensis.exe') /VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NSIS_HOME=$nsis" >> $env:GITHUB_ENV
          $nsis >> $env:GITHUB_PATH
      - name: Verify Windows installer exit guard compiles
        if: runner.os == 'Windows'
        env:
          GOIM_SETUP_COMPILER_QA: '1'
        run: go test ./cmd/package -run '^TestWindowsSetup' -count=1 -timeout=90s
      - name: Verify signed update, installation and relaunch
        if: matrix.os != 'linux'
        env:
          GOIM_NATIVE_UPGRADE_TEST: '1'
        run: go test ./internal/selfupdate -run '^TestNativeUpgrade$' -count=1 -timeout=180s
      - name: Native release package
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          GOIM_UPDATE_PUBLIC_KEY: ${{ vars.GOIM_UPDATE_PUBLIC_KEY }}
          # Linux desktop releases use Viva's pure-Go path. A cgo build binds
          # to the runner's glibc and will not start on older Kylin/UOS hosts.
          CGO_ENABLED: ${{ matrix.os == 'linux' && '0' || '1' }}
        run: |
          bundle="$PWD/.runtime/remote-helper"
          manifest_sha=$(python -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$bundle/manifest.json")
          args=(--version "${PACKAGE_VERSION#v}" --commit "$GITHUB_SHA"
            --remote-desktop-bundle "$bundle" --remote-desktop-manifest-sha256 "$manifest_sha")
          if [ '${{ matrix.os }}' = windows ]; then args+=(--windows-setup); fi
          go run ./cmd/package "${args[@]}"
      - name: Verify Windows installers and shortcut icons
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/verify.ps1 -Version $env:PACKAGE_VERSION.TrimStart('v') -Architecture $env:PACKAGE_ARCH -SkipMSI
      - name: Linux DEB or macOS DMG
        if: runner.os != 'Windows'
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          PACKAGE_OS: ${{ matrix.os }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: bash packaging/unix.sh "${PACKAGE_VERSION#v}" "$PACKAGE_OS" "$PACKAGE_ARCH"
      - name: Verify packaged macOS startup
        if: runner.os == 'macOS'
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          sw_vers
          python3 packaging/macos/smoke_startup.py \
            "dist/GoIM_${PACKAGE_VERSION#v}_darwin_$PACKAGE_ARCH.zip" \
            "$PACKAGE_ARCH" artifacts/startup
      - name: Linux offline file dialog and corresponding sources
        if: runner.os == 'Linux'
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          name="GoIM_${PACKAGE_VERSION#v}_linux_$PACKAGE_ARCH"
          GOIM_TEST_DIALOG_RUNTIME="$PWD/dist/$name/lib/goim/file-dialog" xvfb-run -a go test ./cmd/package -run '^TestBundledLinuxDialogOffline$' -count=1 -timeout=90s
          clipboard_test=$(mktemp -d)
          ln -s "$PWD/dist/$name/lib" "$clipboard_test/lib"
          go test -c -o "$clipboard_test/GoIM" ./internal/desktop
          xvfb-run -a env -u WAYLAND_DISPLAY PATH=/nonexistent GOIM_CLIPBOARD_TEST=1 "$clipboard_test/GoIM" -test.run '^TestNativeClipboardPNGRoundTrip$' -test.timeout=30s
          bash packaging/linux/collect-dialog-sources.sh "dist/$name/lib/goim/file-dialog" "dist/$name-file-dialog-sources.tar.xz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GoIM-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            GoIM/dist/*.zip
            GoIM/dist/*.tar.gz
            GoIM/dist/*-file-dialog-sources.tar.xz
            GoIM/dist/*-Setup.exe
            GoIM/dist/*.dmg
            GoIM/dist/*.deb
            GoIM/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: QA-${{ matrix.os }}-${{ matrix.arch }}
          path: GoIM/artifacts/
          retention-days: 14
  release:
    name: Verify packages and checksums
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: GoIM-*
          merge-multiple: true
          path: release
      - name: Verify packages and source bundles and prepare checksums
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          GOIM_UPDATE_PUBLIC_KEY: ${{ vars.GOIM_UPDATE_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, subprocess, tarfile, zipfile
          root = pathlib.Path('release')
          version = os.environ['PACKAGE_VERSION'].removeprefix('v')
          formats = {'windows': ('.zip', '-Setup.exe'), 'linux': ('.tar.gz', '.deb'), 'darwin': ('.zip', '.dmg')}
          expected = {f'GoIM_{version}_{o}_{a}{ext}': (o,a) for o in formats for a in ('amd64','arm64') for ext in formats[o]}
          expected.update({f'GoIM_{version}_linux_{a}-file-dialog-sources.tar.xz': ('linux', a) for a in ('amd64', 'arm64')})
          found, sums, frameworks, toolchains, public_keys = set(), [], set(), set(), set()
          helper_component = json.loads(pathlib.Path('packaging/remote-desktop/release.lock.json').read_text())
          helper_commit = subprocess.check_output([
              'git', 'bundle', 'list-heads', 'packaging/remote-desktop/rustdesk-goim.bundle',
              'refs/heads/codex/goim-headless'],
              text=True,
          ).split()[0]

          def verify_helper(info, target, read, path, prefix=''):
              assert info['remote_desktop_commit'] == helper_commit == helper_component['source_commit']
              assert info['remote_desktop_version'] == helper_component['version']
              if '-rd-preview.' not in version:
                  assert not info.get('edition'), info.get('edition')
              source_root = prefix+'licenses/rustdesk/'
              manifest = json.loads(read(source_root+'manifest.json'))
              assert (manifest['platform'], manifest['architecture']) == target
              assert manifest['commit'] == helper_commit and manifest['protocol'] == helper_component['protocol']
              assert manifest['version'] == helper_component['version']
              assert manifest['recipe_sha256'] == helper_component['recipe_sha256']
              if target[0] == 'darwin':
                  helper_plist = prefix+'Contents/Helpers/GoIMRemote.app/Contents/Info.plist'
                  assert plistlib.loads(read(helper_plist))['CFBundleShortVersionString'] == helper_component['version']
              license = read(source_root+'LICENSE')
              assert b'GNU AFFERO GENERAL PUBLIC LICENSE' in license
              assert read(source_root+'NOTICE')
              source = read(source_root+'source.tar.gz')
              assert hashlib.sha256(source).hexdigest() == manifest['source_sha256']
              binary = read(prefix+path)
              assert binary, path
              if target[0] != 'darwin':
                  assert hashlib.sha256(binary).hexdigest() == manifest['sha256']
          for p in sorted(root.iterdir()):
              if p.suffix == '.sha256': continue
              assert p.name in expected and p.is_file() and p.stat().st_size > 0, p.name
              target = expected[p.name]
              found.add(p.name)
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              expected_sum, expected_name = (root/(p.name+'.sha256')).read_text().split()
              assert digest==expected_sum and expected_name==p.name, p.name
              sums.append(digest+'  '+p.name)
              if not p.name.endswith(('.zip', '.tar.gz')): continue
              if p.name.endswith('.zip'):
                  with zipfile.ZipFile(p) as z:
                      names=z.namelist()
                      prefix = '' if target[0]=='darwin' else p.stem+'/'
                      info=json.loads(z.read(prefix+'build-info.json'))
                      if target[0]=='darwin':
                          apps = {n.split('/',1)[0] for n in names if n.split('/',1)[0].endswith('.app')}
                          assert apps == {'GoIM.app'}, apps
                          assert (z.getinfo('GoIM.app/Contents/MacOS/GoIM').external_attr >> 16) & 0o111
                          assert (z.getinfo('GoIM.app/Contents/MacOS/goim-media').external_attr >> 16) & 0o111
                          assert (z.getinfo('GoIM.app/Contents/MacOS/goim-snip').external_attr >> 16) & 0o111
                          assert 'GoIM.app/Contents/Info.plist' in names
                          assert 'GoIM.app/Contents/Resources/AppIcon.icns' in names
                          helper = 'GoIM.app/Contents/Helpers/ShotletCapture.app/Contents/'
                          assert helper+'Info.plist' in names
                          native = helper+'MacOS/ShotletCapture'
                          assert (z.getinfo(native).external_attr >> 16) & 0o111
                      else:
                          for entry in ('GoIM.exe', 'GoIM.ico', 'goim-snip.exe', 'goim-media.exe'):
                              assert prefix+entry in names, entry
                          native = prefix+'shotlet/shotlet-capture.exe'
                      assert z.getinfo(native).file_size > 0
                      remote = ('GoIM.app/Contents/Helpers/GoIMRemote.app/Contents/MacOS/goim-rd'
                                if target[0] == 'darwin' else 'remote/goim-rd.exe')
                      verify_helper(info, target, z.read, remote, prefix)
                      if target[0] == 'darwin':
                          assert (z.getinfo(remote).external_attr >> 16) & 0o111
                      for license in ('Apache-2.0.txt', 'THIRD_PARTY_NOTICES.md', 'SDL.txt', 'ImGui.txt', 'nlohmann-json.txt'):
                          assert prefix+'licenses/shotlet/'+license in names, license
              else:
                  with tarfile.open(p) as z:
                      names=z.getnames()
                      info=json.load(z.extractfile(next(n for n in names if n.endswith('/build-info.json'))))
                      exe=z.getmember(next(n for n in names if n.endswith('/GoIM')))
                      assert exe.mode & 0o111
                      prefix = exe.name.rsplit('/', 1)[0]+'/'
                      remote = 'lib/goim/remote/goim-rd'
                      assert z.getmember(prefix+remote).mode & 0o111
                      verify_helper(info, target, lambda name: z.extractfile(name).read(), remote, prefix)
                      assert z.getmember(next(n for n in names if n.endswith('/goim-media'))).mode & 0o111
                      assert z.getmember(next(n for n in names if n.endswith('/goim-snip'))).mode & 0o111
                      assert z.getmember(next(n for n in names if n.endswith('/lib/goim/file-dialog/bin/zenity'))).mode & 0o111
                      assert any(n.endswith('/lib/goim/file-dialog/ld.so') for n in names)
                      assert not any('/licenses/shotlet/' in n for n in names)
                      assert any(n.endswith('/share/applications/dev.goim.desktop.desktop') for n in names)
                      assert any(n.endswith('/share/polkit-1/actions/dev.goim.desktop.policy') for n in names)
                      assert any(n.endswith('/share/icons/hicolor/256x256/apps/goim.png') for n in names)
              assert info['commit']==os.environ['SOURCE_COMMIT'] and info['version']==version and (info['os'],info['arch'])==target
              frameworks.add(info['viva'])
              toolchains.add(info['go'])
              public_keys.add(info.get('update_public_key', ''))
              for media_file in ('ffmpeg-8.1.3.tar.xz', 'FFmpeg-LGPL-2.1.txt', 'build.sh'):
                  assert any(n.endswith('/licenses/ffmpeg/'+media_file) for n in names), (p.name, media_file)
          assert found==expected.keys(), (found,expected.keys())
          assert len(frameworks)==len(toolchains)==1, (frameworks,toolchains)
          assert public_keys == {os.environ['GOIM_UPDATE_PUBLIC_KEY'].strip()}, 'packaged trust key mismatch'
          (root/'SHA256SUMS').write_text('\n'.join(sums)+'\n')
          notes_path = pathlib.Path('docs/releases') / f'{version}.md'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert notes_path.is_file(), f'Missing release notes: {notes_path}'
          notes = notes_path.read_text(encoding='utf-8') if notes_path.is_file() else f'# GoIM {version}'
          body, thanks_heading, thanks = notes.partition('\n## 感谢贡献者\n')
          build_info = (
              '## 构建信息\n\n六个平台架构和十二个软件包通过 CI 校验。\n\n'
              f'- 源码 `{os.environ["SOURCE_COMMIT"]}`\n'
              f'- Viva `{next(iter(frameworks))}`\n'
              f'- Go `{next(iter(toolchains))}`\n'
              f'- RustDesk 助手 `{helper_component["version"]}`（`{helper_commit}`）\n'
          )
          report = f'{body.rstrip()}\n\n{build_info}'
          if thanks_heading:
              report += f'{thanks_heading}{thanks.rstrip()}\n'
          (root/'RELEASE_NOTES.md').write_text(report, encoding='utf-8')
          PY
      - name: Verify Linux packages on a GLIBC 2.31 baseline
        run: |
          set -euo pipefail
          package="$(find release -maxdepth 1 -name 'GoIM_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$package"
          extract="$RUNNER_TEMP/goim-linux-baseline"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$package" -C "$extract"
          payload="$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -x "$payload/GoIM"
          test -x "$payload/goim-snip"
          test -x "$payload/goim-media"
          docker run --rm -v "$payload:/payload:ro" ubuntu:20.04 \
            /bin/sh -eu -c '/payload/goim-media -version >/dev/null && /payload/GoIM -version && /payload/goim-snip -help >/dev/null'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GoIM-checksums-and-report
          path: |
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          retention-days: 14
  update-feed:
    name: Sign stable update feed
    needs: release
    if: |
      !cancelled() && needs.release.result == 'success' && github.event_name == 'push' &&
      github.ref_type == 'tag' && !contains(github.ref_name, '-') && vars.GOIM_UPDATE_PUBLIC_KEY != ''
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: goim-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.3'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: GoIM-*
          merge-multiple: true
          path: release
      - name: Sign the stable update feed
        env:
          GOIM_UPDATE_PUBLIC_KEY: ${{ vars.GOIM_UPDATE_PUBLIC_KEY }}
          GOIM_UPDATE_PRIVATE_KEY: ${{ secrets.GOIM_UPDATE_PRIVATE_KEY }}
        run: go run ./cmd/update-feed --dir release --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GoIM-signed-update-feed
          path: release/goim-update.json*
          if-no-files-found: error
          retention-days: 14
