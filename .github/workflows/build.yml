name: Verify and package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        default: 0.1.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, os: windows, arch: amd64, goarch: x64}
          - {runner: windows-11-arm, os: windows, arch: arm64, goarch: arm64}
          - {runner: ubuntu-24.04, os: linux, arch: amd64, goarch: x64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, goarch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64, goarch: x64}
          - {runner: macos-15, os: darwin, arch: arm64, goarch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: GoIM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: GoIM}
      - name: Read Viva revision
        id: viva-pin
        run: |
          ref="$(tr -d '\r\n' < framework/viva-commit.txt)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Viva
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vivaui/viva
          ref: ${{ steps.viva-pin.outputs.ref }}
          path: viva
      - name: Apply reviewed framework patches
        run: |
          test "$(git -C ../viva rev-parse HEAD)" = "$(tr -d '\r\n' < framework/viva-commit.txt)"
          git -C ../viva -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
          git -C ../viva apply ../GoIM/framework/0003-window-size.patch ../GoIM/framework/0004-windows-tray-notifications.patch
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.goarch }}
          cache-dependency-path: GoIM/go.sum
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers fonts-noto-cjk xvfb xdotool
      - name: Verify native architecture and dependencies
        run: |
          test "$(go env GOARCH)" = '${{ matrix.arch }}'
          go mod download
          git diff --exit-code -- go.mod go.sum
      - name: Format, vet and full tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./... -count=1 -timeout=180s
      - name: Windows notification area regression
        if: runner.os == 'Windows'
        run: go test github.com/vivaui/viva/internal/platform/windows -run '^TestDesktopNotificationReusesStatusItem$' -count=1
      - name: Core and background media race tests
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: go test -race ./internal/core ./internal/desktop ./internal/ipmsg -count=1 -timeout=180s
      - name: Shared catalog ordering regression on macOS Intel
        if: matrix.os == 'darwin' && matrix.arch == 'amd64'
        run: go test ./internal/core -run 'TestCatalogRejectsOutOfOrderInitialSnapshot|TestUnsharingPreservesDownloadedMetadata' -count=20 -timeout=120s
      - name: Offscreen UI screenshots
        env:
          GOIM_QA_SCREENSHOTS: ${{ github.workspace }}/GoIM/artifacts/screenshots
          GOIM_CHAT_QA_SCREENSHOTS: ${{ github.workspace }}/GoIM/artifacts/screenshots/chat
          GOIM_SNIP_SHOT_DIR: ${{ github.workspace }}/GoIM/artifacts/screenshots/snip
          GOIM_SHARE_LIST_QA: ${{ github.workspace }}/GoIM/artifacts/screenshots/shares
          GOIM_TRANSFER_QA: ${{ github.workspace }}/GoIM/artifacts/screenshots/transfers
        run: |
          go test -tags vivahead ./internal/desktop -run 'TestShellScreenshotQA|TestDesktopScaleMatrix|TestShellContextScreenshotQA|TestShareListDesignScreenshots|TestTransferDesignScreenshots|TestChatLayoutScreenshotQA' -count=1 -timeout=180s
          go test -tags vivahead ./cmd/goim-snip -run '^TestEditorScreenshots$' -count=1 -timeout=60s
      - name: Native content resize
        env:
          VIVA_NATIVE_WINDOW_SIZE_TEST: '1'
        run: |
          cd ../viva
          case '${{ matrix.os }}' in
            windows) go test ./app -run '^TestNativeProgrammaticWindowSize$' -count=1 -timeout=45s ;;
            linux) xvfb-run -a go test ./app -run '^TestNativeProgrammaticWindowSize$' -count=1 -timeout=45s ;;
            darwin) go test ./app -run '^TestWindowSetSize' -count=1 -timeout=45s ;;
          esac
      - name: Native global shortcut lifecycle
        env:
          VIVA_NATIVE_GLOBAL_SHORTCUT_TEST: '1'
        run: |
          cd ../viva
          case '${{ matrix.os }}' in
            windows) go test ./internal/platform/windows -run '^TestNative.*GlobalShortcut' -count=1 -timeout=30s -v ;;
            linux) xvfb-run -a go test ./internal/platform/linux -run '^TestNativeX11GlobalShortcut$' -count=1 -timeout=30s -v ;;
            darwin) go test ./internal/platform/darwin -run '^TestNativeCarbonGlobalShortcut$' -count=1 -timeout=30s -v ;;
          esac
      - name: Native Direct2D point ABI and rendering benchmark
        if: matrix.os == 'windows'
        run: |
          mkdir -p artifacts
          cd ../viva
          go test ./internal/platform/windows -run '^TestDirectTextLayoutOriginByValue$' -count=1
          go test ./internal/platform/windows -run '^$' -bench '^BenchmarkRasterizeOnly$' -benchtime=100ms -benchmem -count=3 > ../GoIM/artifacts/framework-render-benchmark.txt
      - name: Windows three-process smoke
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Headless
          ./scripts/smoke-headless.ps1
      - name: Native release package
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: go run ./cmd/package --version "${PACKAGE_VERSION#v}" --commit "$GITHUB_SHA"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Windows Setup and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/build.ps1 -Version $env:PACKAGE_VERSION.TrimStart('v') -Architecture $env:PACKAGE_ARCH
      - name: Linux DEB or macOS DMG
        if: runner.os != 'Windows'
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          PACKAGE_OS: ${{ matrix.os }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: bash packaging/unix.sh "${PACKAGE_VERSION#v}" "$PACKAGE_OS" "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GoIM-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            GoIM/dist/*.zip
            GoIM/dist/*.tar.gz
            GoIM/dist/*-Setup.exe
            GoIM/dist/*.msi
            GoIM/dist/*.dmg
            GoIM/dist/*.deb
            GoIM/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: QA-${{ matrix.os }}-${{ matrix.arch }}
          path: GoIM/artifacts/
          retention-days: 14
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: GoIM-*
          merge-multiple: true
          path: release
      - name: Install MSI inspection tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends msitools
      - name: Verify fourteen packages and prepare checksums
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tarfile, zipfile
          root = pathlib.Path('release')
          version = os.environ['PACKAGE_VERSION'].removeprefix('v')
          formats = {'windows': ('.zip', '-Setup.exe', '.msi'), 'linux': ('.tar.gz', '.deb'), 'darwin': ('.zip', '.dmg')}
          expected = {f'GoIM_{version}_{o}_{a}{ext}': (o,a) for o in formats for a in ('amd64','arm64') for ext in formats[o]}
          found, sums, frameworks, toolchains = set(), [], set(), set()
          for p in sorted(root.iterdir()):
              if p.suffix == '.sha256': continue
              assert p.name in expected and p.is_file() and p.stat().st_size > 0, p.name
              target = expected[p.name]
              found.add(p.name)
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              expected_sum, expected_name = (root/(p.name+'.sha256')).read_text().split()
              assert digest==expected_sum and expected_name==p.name, p.name
              sums.append(digest+'  '+p.name)
              if p.suffix == '.msi':
                  summary = subprocess.check_output(['msiinfo', 'suminfo', p], text=True)
                  template = re.search(r'^Template:\s*([^;\n]+)', summary, re.MULTILINE | re.IGNORECASE)
                  arch = 'x64' if target[1] == 'amd64' else 'arm64'
                  assert template and template[1].lower() == arch, (p.name, summary)
                  table = subprocess.check_output(['msiinfo', 'export', p, 'File'], text=True)
                  filenames = {line.split('\t')[2].rsplit('|', 1)[-1] for line in table.splitlines()[3:] if line}
                  assert {'GoIM.exe', 'goim-snip.exe', 'GoIM.ico', 'build-info.json', 'LICENSE'} <= filenames, (p.name, filenames)
              if not p.name.endswith(('.zip', '.tar.gz')): continue
              if p.name.endswith('.zip'):
                  with zipfile.ZipFile(p) as z:
                      names=z.namelist()
                      info=json.loads(z.read(next(n for n in names if n.endswith('/build-info.json'))))
                      assert any(n.endswith('/GoIM.exe' if target[0]=='windows' else '/GoIM.app/Contents/MacOS/GoIM') for n in names)
                      snip = next(n for n in names if n.endswith('/goim-snip.exe' if target[0]=='windows' else '/GoIM.app/Contents/MacOS/goim-snip'))
                      if target[0]=='darwin': assert (z.getinfo(snip).external_attr >> 16) & 0o111
                      if target[0]=='darwin': assert any(n.endswith('/GoIM.app/Contents/Info.plist') for n in names)
                      if target[0]=='darwin': assert any(n.endswith('/GoIM.app/Contents/Resources/AppIcon.icns') for n in names)
                      if target[0]=='windows': assert any(n.endswith('/GoIM.ico') for n in names)
              else:
                  with tarfile.open(p) as z:
                      names=z.getnames()
                      info=json.load(z.extractfile(next(n for n in names if n.endswith('/build-info.json'))))
                      exe=z.getmember(next(n for n in names if n.endswith('/GoIM')))
                      assert exe.mode & 0o111
                      assert z.getmember(next(n for n in names if n.endswith('/goim-snip'))).mode & 0o111
                      assert any(n.endswith('/share/applications/dev.goim.desktop.desktop') for n in names)
                      assert any(n.endswith('/share/icons/hicolor/256x256/apps/goim.png') for n in names)
              assert info['commit']==os.environ['SOURCE_COMMIT'] and info['version']==version and (info['os'],info['arch'])==target
              frameworks.add(info['viva'])
              toolchains.add(info['go'])
              assert any('/licenses/' in n for n in names)
          assert found==expected.keys(), (found,expected.keys())
          assert len(frameworks)==len(toolchains)==1, (frameworks,toolchains)
          (root/'SHA256SUMS').write_text('\n'.join(sums)+'\n')
          notes=f'GoIM {version}\n\nSix native targets and fourteen packages passed CI. Includes Windows ZIP, Setup and MSI, macOS ZIP and DMG, and Linux tar.gz and DEB. Windows three-process smoke and Linux race checks passed.\n\nSource: {os.environ["SOURCE_COMMIT"]}\nViva: {next(iter(frameworks))}\nGo: {next(iter(toolchains))}\n'
          (root/'RELEASE_NOTES.md').write_text(notes)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GoIM-checksums-and-report
          path: |
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          retention-days: 14
