name: GoIM checks
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
permissions: {contents: read}
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3'}
      - name: Chinese font coverage for the native painter
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./... -count=1 -timeout=180s
          go test -race ./internal/core ./internal/desktop ./internal/ipmsg ./internal/neiwangtong -count=1 -timeout=180s
          git diff --exit-code -- go.mod go.sum
  windows-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3'}
      - name: Windows desktop tests and three-process smoke
        shell: pwsh
        run: |
          go test ./... -count=1 -timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-headless.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-headless
          path: artifacts/headless/
          retention-days: 14
