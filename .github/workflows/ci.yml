name: Core checks
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
permissions: {contents: read}
jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: GoIM}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: GoIM}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: vivaui/viva, ref: fee2ecb8c1fb4ca2abf776123cdd9f8e4246895e, path: viva}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3', cache-dependency-path: GoIM/go.sum}
      - run: |
          git -C ../viva -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
          git -C ../viva apply ../GoIM/framework/0001-global-shortcuts.patch
      - name: Chinese font coverage for the native painter
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./... -count=1 -timeout=180s
          go test -race ./internal/core -count=1 -timeout=180s
