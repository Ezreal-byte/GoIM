name: Remote desktop helper release
on:
  push:
    tags: ['goim-rd-v*']
  workflow_dispatch:
    inputs:
      source_run:
        description: Optional successful helper build run to promote without recompiling
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: remote-desktop-helper-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify helper version and optional source build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          tag=$(python3 scripts/remote-helper.py profile | jq -er .tag)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ]; then
            python3 scripts/remote-helper.py verify-release
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ -n "$SOURCE_RUN" ]; then
              python3 scripts/remote-helper.py verify-run --run "$SOURCE_RUN"
            fi
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true' && inputs.source_run == ''
    uses: ./.github/workflows/remote-desktop-build.yml

  publish:
    needs: [prepare, build]
    if: |
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.exists != 'true' &&
      (needs.build.result == 'success' || inputs.source_run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Download the verified helper build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run || github.run_id }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY"             --pattern 'goim-rd-*' --dir helper-bundles
          python3 scripts/remote-helper.py pack --input helper-bundles             --output helper-release --run "$SOURCE_RUN"
      - name: Publish the independent helper version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/remote-helper.py publish --input helper-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-helper-release-pin
          path: |
            helper-release/release.lock.json
            helper-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14